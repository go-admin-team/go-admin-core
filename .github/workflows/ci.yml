name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language:
    name: english-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check added Go code and commit messages
        run: scripts/check-language.sh origin/${{ github.base_ref || 'main' }}

  build:
    name: build / vet / race
    runs-on: ubuntu-latest

    services:
      # The Redis conformance tests skip themselves unless REDIS_URL is set,
      # so the suite still runs locally without a server.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Fails when go.mod/go.sum are out of sync with the source tree.
      - name: Verify module files
        run: make tidy

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Verify exported API snapshot
        run: make api-check

      - name: Test with race detector
        run: make test-race

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan dependencies
        run: make vuln
