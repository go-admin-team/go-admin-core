name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language:
    name: english-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check added Go code and commit messages
        run: scripts/check-language.sh origin/${{ github.base_ref || 'main' }}

  build:
    name: build / vet / race
    runs-on: ubuntu-latest

    services:
      # The Redis conformance tests skip themselves unless REDIS_URL is set,
      # so the suite still runs locally without a server.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Fails when go.mod/go.sum are out of sync with the source tree.
      - name: Verify module files
        run: make tidy

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Verify exported API snapshot
        run: make api-check

      - name: Test with race detector
        run: make test-race

  canary:
    name: canary / go-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The consumer is built from its own default branch, against this tree.
      # A written compatibility promise stops nobody; this is the check that
      # fails when a change here breaks the open-source consumer. When the
      # consumer's own branch is broken, the fix belongs in that repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: go-admin-team/go-admin
          path: consumer

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            consumer/go.sum

      - name: Build the consumer against this tree
        # setup-go pins GOTOOLCHAIN=local, which fails outright when either
        # module asks for a newer Go than the one it installed — the consumer
        # was a minor ahead the first time this job ran. Letting the toolchain
        # resolve is what a consumer's own build does anyway.
        env:
          GOTOOLCHAIN: auto
        run: scripts/canary.sh "${{ github.workspace }}/consumer"

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Every exemption in the tree names its reason on the line above it.
      # Adding one is a decision to be reviewed, not a way to quiet the job.
      - name: Lint
        run: make lint

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan dependencies
        run: make vuln
